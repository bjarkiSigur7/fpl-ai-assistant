[project]
name = "fplai"
version = "0.1.0"
description = "FPL AI Assistant — expected-points models and multi-gameweek squad optimizer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "highspy>=1.8",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tenacity>=9.0",
    "typer>=0.15",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
fplai = "fplai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real network services (deselected by default; run with -m live)",
]
